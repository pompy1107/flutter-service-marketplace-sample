name: flutter_service_marketplace_sample
description: "Sanitized portfolio snapshot of a production Flutter service marketplace."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  cloud_functions: ^6.0.3
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1
  firebase_storage: ^13.0.6
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.2.6
  cached_network_image: ^3.4.1
  google_maps_flutter: ^2.6.1
  geolocator: ^13.0.2
  http: ^1.2.2
  google_places_flutter: ^2.0.9
  firebase_crashlytics: ^5.2.4
  firebase_analytics: ^12.4.3
  firebase_performance: ^0.11.4+3
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.0
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
